name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Must match the engine stub directory in public/ (the -1 suffix is a
      # cache-bust revision, not a Docker tag — see the Dockerfile's HASH arg).
      APP_ROOT_VERSION: v9.3.0.24-1
      DS_IMAGE: onlyoffice/documentserver:9.3.0
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /office-website

      # The OnlyOffice engine runtime (sdkjs, web-apps vendor code, fonts)
      # is not committed to git — extract it from the DocumentServer image
      # so the editor works on the static GitHub Pages deployment.
      - name: Fetch OnlyOffice engine assets
        run: |
          set -euo pipefail
          docker pull "$DS_IMAGE"
          # The default entrypoint runs documentserver-generate-allfonts during
          # boot, which is what produces sdkjs/common/AllFonts.js. Create the
          # container, start it, and wait for that generated file.
          cid=$(docker create "$DS_IMAGE")
          docker start "$cid"
          for i in $(seq 1 60); do
            if docker exec "$cid" test -s /var/www/onlyoffice/documentserver/sdkjs/common/AllFonts.js; then
              break
            fi
            sleep 2
          done
          docker exec "$cid" test -s /var/www/onlyoffice/documentserver/sdkjs/common/AllFonts.js

          # Replace the committed public/ stub tree entirely — docker cp into a
          # pre-existing sdkjs/ directory would nest it as sdkjs/sdkjs.
          rm -rf "out/$APP_ROOT_VERSION"
          mkdir -p "out/$APP_ROOT_VERSION"
          src=/var/www/onlyoffice/documentserver
          docker cp "$cid:$src/sdkjs" "out/$APP_ROOT_VERSION/sdkjs"
          docker cp "$cid:$src/web-apps" "out/$APP_ROOT_VERSION/web-apps"
          docker cp "$cid:$src/fonts" "out/$APP_ROOT_VERSION/fonts"
          docker cp "$cid:$src/sdkjs-plugins" "out/$APP_ROOT_VERSION/sdkjs-plugins"
          docker rm -f "$cid"

          # api.js is normally generated at container startup from this template
          cp "out/$APP_ROOT_VERSION/web-apps/apps/api/documents/api.js.tpl" \
             "out/$APP_ROOT_VERSION/web-apps/apps/api/documents/api.js"
          chmod -R a+rX "out/$APP_ROOT_VERSION"

      # The stub tree in public/ only exists so the build finds
      # api.js/preload.html; it is fully shadowed by the extracted assets.
      - name: Verify editor entry points
        run: |
          set -euo pipefail
          test -s "out/$APP_ROOT_VERSION/web-apps/apps/api/documents/api.js"
          test -s "out/$APP_ROOT_VERSION/web-apps/apps/documenteditor/main/index.html"
          test -s "out/$APP_ROOT_VERSION/web-apps/vendor/requirejs/require.js"
          test -s "out/$APP_ROOT_VERSION/sdkjs/common/AllFonts.js"
          test -s "out/$APP_ROOT_VERSION/sdkjs/word/sdk-all-min.js"
          du -sh "out/$APP_ROOT_VERSION"

      # GitHub Pages can't send "Content-Encoding: br", so decompress any
      # pre-compressed x2t assets in the build output
      - name: Decompress brotli x2t assets
        run: |
          sudo apt-get install -y brotli
          find out -path 'out/x2t*' -type f | while read -r f; do
            if brotli -t "$f" 2>/dev/null; then
              brotli -d -f "$f" -o "$f.tmp" && mv "$f.tmp" "$f"
              echo "decompressed $f"
            fi
          done

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
