name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Must match the engine stub directory in public/ (the -1 suffix is a
      # cache-bust revision, not a Docker tag — see the Dockerfile's HASH arg).
      APP_ROOT_VERSION: v9.3.0.24-1
      DS_IMAGE: onlyoffice/documentserver:9.3.0
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - run: bun install --frozen-lockfile

      - run: bun run build
        env:
          NEXT_PUBLIC_BASE_PATH: /office-website

      # The OnlyOffice engine runtime (sdkjs, web-apps vendor code, fonts)
      # is not committed to git — extract it from the DocumentServer image
      # so the editor works on the static GitHub Pages deployment.
      #
      # `docker cp` is deliberately avoided: on the runner's rootless Docker
      # daemon it restores the image's own uid/gid ownership, so subsequent
      # copies into the same directory fail with "permission denied". Tarring
      # out of a container that writes through a bind mount produces files the
      # runner user owns, with sane modes.
      - name: Fetch OnlyOffice engine assets
        run: |
          set -euo pipefail
          docker pull "$DS_IMAGE"
          dst="$GITHUB_WORKSPACE/out/$APP_ROOT_VERSION"
          rm -rf "$dst"
          mkdir -p "$dst"

          docker run --rm \
            -v "$dst:/dst" \
            --entrypoint /bin/sh \
            "$DS_IMAGE" -ec '
              # AllFonts.js is generated at startup by the image tooling;
              # run it explicitly so the font lists exist before packing.
              documentserver-generate-allfonts.sh false || echo "allfonts generator skipped"
              cd /var/www/onlyoffice/documentserver
              # Help-documentation GIFs are ~514MB of the 664MB web-apps tree
              # and IE-only bundles are dead weight; neither is loaded by the
              # editor at runtime. Pruning keeps the Pages artifact ~457MB.
              tar -cf /dst/sdkjs.tar --exclude="*_ie.js" sdkjs
              tar -cf /dst/web-apps.tar --exclude="*/resources/help" --exclude="*_ie.js" web-apps
              tar -cf /dst/fonts.tar fonts
              tar -cf /dst/sdkjs-plugins.tar sdkjs-plugins
            '

          for d in sdkjs web-apps fonts sdkjs-plugins; do
            tar -xf "$dst/$d.tar" -C "$dst"
            rm -f "$dst/$d.tar"
          done

          # api.js is normally generated at container startup from this template
          cp "$dst/web-apps/apps/api/documents/api.js.tpl" \
             "$dst/web-apps/apps/api/documents/api.js"
          chmod -R a+rX "$dst"

      # The stub tree in public/ only exists so the build finds
      # api.js/preload.html; it is fully shadowed by the extracted assets.
      - name: Verify editor entry points
        run: |
          set -euo pipefail
          test -s "out/$APP_ROOT_VERSION/web-apps/apps/api/documents/api.js"
          test -s "out/$APP_ROOT_VERSION/web-apps/apps/documenteditor/main/index.html"
          test -s "out/$APP_ROOT_VERSION/web-apps/vendor/requirejs/require.js"
          test -s "out/$APP_ROOT_VERSION/sdkjs/common/AllFonts.js"
          test -s "out/$APP_ROOT_VERSION/sdkjs/word/sdk-all-min.js"
          du -sh "out/$APP_ROOT_VERSION"

      # GitHub Pages can't send "Content-Encoding: br", so decompress any
      # pre-compressed x2t assets in the build output
      - name: Decompress brotli x2t assets
        run: |
          sudo apt-get install -y brotli
          find out -path 'out/x2t*' -type f | while read -r f; do
            if brotli -t "$f" 2>/dev/null; then
              brotli -d -f "$f" -o "$f.tmp" && mv "$f.tmp" "$f"
              echo "decompressed $f"
            fi
          done

      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
